name: Plugin

# The web app publishes itself from deploy.yml. This builds the plugin target — AU, VST3 and the
# standalone app — signs and notarises it, and on a version tag publishes a release.
#
# Windows is the next platform. It joins as a second build job beside `macos`; the release job
# already packages whatever the build jobs upload, so adding it needs no changes down there.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Sign and notarise (slow; normally only done for tags)'
        type: boolean
        default: false

permissions:
  contents: read

# A tag pushed straight after its commit would otherwise build main and the tag at once.
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The sysex codec is verified against the factory corpus, so a broken decode fails here
      # rather than being wrapped up inside a plugin and shipped.
      - name: Test
        run: npm test

      # The panel is built first: CMake refuses to configure without it, having nothing to embed.
      - name: Build the web bundle
        run: npm run build:plugin

      # Only JUCE's checkout is cached, not the object tree. A stale build directory is a far
      # nastier failure than a slow build, and the clone is the part worth saving.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: .deps
          key: juce-macos-${{ hashFiles('native/CMakeLists.txt') }}
          restore-keys: juce-macos-

      - name: Configure
        run: >
          cmake -B native/build -S native
          -DCMAKE_BUILD_TYPE=Release
          -DPROPHET_COPY_PLUGIN=OFF
          -DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.deps

      - name: Build
        run: cmake --build native/build --parallel

      - name: Check the artefacts are universal
        run: |
          A="native/build/ProphetPanel_artefacts/Release"
          for binary in \
            "$A/AU/Prophet Panel.component/Contents/MacOS/Prophet Panel" \
            "$A/VST3/Prophet Panel.vst3/Contents/MacOS/Prophet Panel" \
            "$A/Standalone/Prophet Panel.app/Contents/MacOS/Prophet Panel"; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "::error::$binary is not universal ($archs)"; exit 1 ;;
            esac
          done

      # Which credentials this run actually has. A pull request from a fork has none and must still
      # build and validate — so signing is a capability the run either has or does not, never a
      # step that fails for lacking a secret.
      - name: What credentials are available
        id: creds
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        run: |
          sign=false; notary=false
          [ -n "$CERT" ] && sign=true
          { [ -n "$NOTARY_KEY_P8" ] || [ -n "$NOTARY_APPLE_ID" ]; } && notary=true
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notary=$notary" >> "$GITHUB_OUTPUT"
          echo "signing: $sign · notarisation: $notary"

      # A throwaway keychain rather than the login one: it is deleted when the job ends, it never
      # holds anything but this certificate, and it cannot leave a private key behind on a runner
      # image if a later step fails.
      - name: Import the signing certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/prophet-signing.keychain-db"
          # Random and never persisted: this keychain lives for one job and nothing else opens it.
          password="$(openssl rand -base64 24)"
          echo "::add-mask::$password"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
                   -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$cert"

          # Without this, codesign blocks on a GUI prompt for keychain access that nothing on a
          # runner can ever answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null

          # The keychain has to be in the search list for `security find-identity` to see it, and
          # `-s` *replaces* the list rather than adding to it — so the old one is saved first and
          # put back by the cleanup step. On a disposable runner that is merely tidy; the same
          # snippet run on a real machine without it quietly hides every other keychain, which
          # looks exactly like the signing certificate having vanished.
          security list-keychain -d user | sed -E 's/^[[:space:]]*"?//; s/"?$//' \
            > "$RUNNER_TEMP/keychain-search-list"
          search_list=""
          while IFS= read -r entry; do
            [ -n "$entry" ] && search_list="$search_list \"$entry\""
          done < "$RUNNER_TEMP/keychain-search-list"
          eval "security list-keychain -d user -s \"$keychain\" $search_list"

          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application"

      # Signed before validation, so auval exercises the bundles that actually ship rather than the
      # ones that happened to exist before signing changed them.
      - name: Sign
        if: steps.creds.outputs.sign == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: ./native/tools/macos-sign.sh "native/build/ProphetPanel_artefacts/Release"

      # auval is the gate for the Audio Unit: Logic will not load a component that fails it, so a
      # component that fails it is not worth publishing. The codes are read from the built plist
      # rather than repeated here, which is one fewer place for them to disagree.
      - name: auval
        run: |
          A="native/build/ProphetPanel_artefacts/Release"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto "$A/AU/Prophet Panel.component" ~/Library/Audio/Plug-Ins/Components/"Prophet Panel.component"
          plist="$A/AU/Prophet Panel.component/Contents/Info.plist"
          type=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:type" "$plist")
          subtype=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:subtype" "$plist")
          manufacturer=$(/usr/libexec/PlistBuddy -c "Print :AudioComponents:0:manufacturer" "$plist")
          echo "validating $type $subtype $manufacturer"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v "$type" "$subtype" "$manufacturer"

      # Notarisation is a round trip to Apple that takes minutes, so it is reserved for tags and
      # for a deliberate workflow_dispatch — which exists precisely so the path can be proved
      # before a tag depends on it.
      - name: Notarise, staple and package
        id: notarize
        if: >-
          steps.creds.outputs.sign == 'true' && steps.creds.outputs.notary == 'true' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.notarize)
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          BUNDLE_ID: dev.ProphetPanel
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        # `done` is what gates the release artefact below, so it is set here rather than inferred
        # from the step succeeding — without it every tag would quietly publish the unsigned zip.
        run: |
          ./native/tools/macos-notarize.sh "native/build/ProphetPanel_artefacts/Release" dist
          echo "done=true" >> "$GITHUB_OUTPUT"
        # continue-on-error is deliberately absent: a tag that cannot be notarised should fail
        # loudly rather than quietly publish something Gatekeeper will block.

      - name: Collect
        run: |
          A="native/build/ProphetPanel_artefacts/Release"
          mkdir -p out
          # After stapling these carry their notarisation tickets, so ditto rather than cp -R: it
          # is the copy that keeps the extended attributes a signed bundle depends on.
          ditto "$A/AU/Prophet Panel.component"   "out/Prophet Panel.component"
          ditto "$A/VST3/Prophet Panel.vst3"      "out/Prophet Panel.vst3"
          ditto "$A/Standalone/Prophet Panel.app" "out/Prophet Panel.app"

          {
            echo "### macOS"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| signed | ${{ steps.creds.outputs.sign }} |"
            echo "| notarised | ${{ steps.notarize.outputs.done || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: prophet-panel-macos-universal
          path: out/
          if-no-files-found: error

      # Only present when notarisation ran; that is what the release job publishes.
      - uses: actions/upload-artifact@v4
        if: steps.notarize.outputs.done == 'true'
        with:
          name: prophet-panel-macos-release
          path: dist/
          if-no-files-found: error

      # `always()`, because a private key outliving the job that needed it is exactly the failure
      # mode a throwaway keychain exists to prevent.
      - name: Remove the signing keychain
        if: always() && steps.creds.outputs.sign == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/keychain-search-list" ]; then
            search_list=""
            while IFS= read -r entry; do
              [ -n "$entry" ] && search_list="$search_list \"$entry\""
            done < "$RUNNER_TEMP/keychain-search-list"
            [ -n "$search_list" ] && eval "security list-keychain -d user -s $search_list" || true
          fi
          security delete-keychain "$RUNNER_TEMP/prophet-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/keychain-search-list"

  # --------------------------------------------------------------------------------------------
  # Tags only. Everything that reaches here has built universal and passed auval.
  # --------------------------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      # Needed for native/packaging/release-notes-*.md; the artefacts themselves come from the
      # build job rather than from the tree.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist

          # The macOS archive comes from the build job already zipped, because it has to: the
          # stapled tickets are extended attributes, and only ditto reliably carries them. If
          # notarisation did not run there is nothing to preserve, so a plain archive of the
          # bundles is both possible and honest about what it is.
          if [ -d artifacts/prophet-panel-macos-release ]; then
            cp artifacts/prophet-panel-macos-release/*.zip dist/ 2>/dev/null || true
            cp artifacts/prophet-panel-macos-release/*.pkg dist/ 2>/dev/null || true
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            ditto -c -k --keepParent artifacts/prophet-panel-macos-universal \
                  "dist/ProphetPanel-${version}-macOS-universal.zip"
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la dist

      # Kept as files rather than heredocs: they are prose someone will want to edit, and prose is
      # easier to review in a .md than inside a YAML block scalar.
      - name: Release notes
        run: |
          if [ "${{ steps.package.outputs.notarized }}" = "true" ]; then
            cp native/packaging/release-notes-signed.md notes.md
          else
            cp native/packaging/release-notes-unsigned.md notes.md
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Prophet Panel ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file notes.md
