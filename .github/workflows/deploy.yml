name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The minimum the Pages deployment needs: read the repo, write a Pages deployment, and mint the
# OIDC token deploy-pages uses to prove the artifact came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The sysex codec is verified against the factory corpus in patches/, so a broken decode
      # fails here rather than being published.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
